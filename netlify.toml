# Build and deploy the ReGenerativa constellation as a website (Quartz v4).
# Every push to the connected branch triggers this build.

[build]
  base = "website"
  command = "bash build.sh"
  publish = "public"
  # With base=website, Netlify's default change detection ignores commits that
  # only touch the vault content outside it. Build when website/, the vault, or
  # this file changed. (Runs from the base directory; non-zero exit = build.)
  # Guard: if CACHED_COMMIT_REF is empty (first build, or after a cancelled
  # deploy) the diff would silently compare against the working tree and
  # return 0 -> "no content change". Force a build in that case.
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ../ReGenerativa ../netlify.toml"

[build.environment]
  # Quartz v4 requires Node >= 22.
  NODE_VERSION = "22"

# The Q&A chat assistant backend (website/netlify/functions/chat.mts, served
# at /api/chat). Paths are relative to base = "website". corpus.md is
# generated by build.sh and must be packaged alongside the function bundle.
# Secrets (OPENAI_API_KEY) live in the Netlify UI, never here.
[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/corpus.md"]
